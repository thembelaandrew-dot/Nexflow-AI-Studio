<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="nexaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02050c"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="128" fill="none" stroke="url(#nexaGrad)" stroke-width="8" stroke-opacity="0.3"/>
  <!-- Glowing Monogram / Emblem -->
  <g filter="url(#glow)" transform="translate(40, 40)">
    <!-- Futuristic N Wave Flow -->
    <path d="M 80,340 L 80,92 L 136,92 L 296,308 L 296,92 L 352,92 L 352,340 L 296,340 L 136,124 L 136,340 Z" fill="url(#nexaGrad)"/>
    <circle cx="80" cy="92" r="14" fill="#06b6d4"/>
    <circle cx="352" cy="340" r="14" fill="#10b981"/>
    <circle cx="216" cy="216" r="10" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
